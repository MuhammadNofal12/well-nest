services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wellnest
      POSTGRES_USER: wellnest
      POSTGRES_PASSWORD: wellnest
    ports:
      - "5433:5432"
    volumes:
      - wellnest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellnest -d wellnest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wellnest-postgres:
